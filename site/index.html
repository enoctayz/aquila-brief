:root {
  /* brand tokens: the film's theme (turkish-ai-film/build.mjs), sampled from the Enocta PDF */
  --crimson: #CB1F47;
  --ink: #18181A;
  --tint: #FBF1F3;
  --deep: #971627;
  --deep2: #85131C;
  --pink: #F4A9BA;
  --pink-lt: #FFD3DD;
  --paper: #FFFFFF;
  --grey: #85858C;
  --grey2: #4A4A50;
  --grey3: #CFCCD2;
  --line: #D9D6DA;
  --panel: #27272B;
  --head: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter: clamp(16px, 4vw, 48px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:focus-visible { outline: 3px solid var(--crimson); outline-offset: 4px; }

/* dark header band: the logo is white-only, so it only ever sits on ink */
.band { background: var(--ink); color: #fff; border-bottom: 4px solid var(--crimson); }
.band-in { width: min(1120px, 100% - 2 * var(--gutter)); margin-inline: auto; padding-block: clamp(20px, 3vw, 30px); display: flex; align-items: center; gap: clamp(16px, 2.4vw, 28px); }
.logo { display: block; width: 80px; height: auto; flex: none; }
.band h1 { padding-left: clamp(16px, 2.4vw, 28px); border-left: 1px solid rgba(255,255,255,.22); font: 700 clamp(22px, 3vw, 34px)/1.15 var(--head); letter-spacing: -.01em; }

main { width: min(1120px, 100% - 2 * var(--gutter)); margin-inline: auto; padding-block: clamp(36px, 6vw, 80px); }
.grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 3vw, 40px); }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { display: flex; flex-direction: column; height: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.card:hover { transform: translateY(-4px); border-color: var(--crimson); box-shadow: 0 18px 40px -20px rgba(24,24,26,.4); }
.card:focus-visible { border-color: var(--crimson); }
.thumb { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: var(--ink); }
.body { display: flex; flex-direction: column; flex: 1; padding: 24px 26px 26px; }
.tag { font: 500 13px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--crimson); overflow-wrap: anywhere; }
@media (max-width: 520px) { .tag { letter-spacing: .03em; } }
.card h2 { text-wrap: balance; margin-top: 10px; font: 700 clamp(22px, 2.3vw, 28px)/1.2 var(--head); letter-spacing: -.01em; transition: color .2s ease; }
.card:hover h2 { color: var(--crimson); }
.summary { margin-top: 10px; font-size: 18px; line-height: 1.5; color: var(--grey2); }
.meta { margin-top: auto; padding-top: 22px; display: flex; align-items: center; gap: 8px; font: 500 14px/1.2 var(--mono); color: var(--grey2); }
.meta svg { width: 14px; height: 14px; fill: var(--crimson); flex: none; }
.dur { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .card:hover { transform: none; }
}
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { margin: 12mm; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card { break-inside: avoid; box-shadow: none; transform: none; }
  .body { padding: 14px 16px 16px; }
  .summary { font-size: 14px; }
  main { padding-block: 20px; }
}
